<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />

    <title>Rejie Rufin — Freight Forwarding &amp; Shipping Operations Specialist</title>
    <meta
      name="description"
      content="Rejie Rufin is a freight forwarding and shipping operations specialist in Bacoor City, Philippines — import customs manifests, ocean and air freight documentation, and the process tools that keep both accurate."
    />
    <meta name="author" content="Rejie Rufin" />
    <meta name="robots" content="index, follow, max-image-preview:large" />
    <meta name="theme-color" content="#f2f2ea" />
    <!-- <link rel="canonical" href="https://rejierufin.github.io/" /> -->

    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />

    <meta http-equiv="X-Content-Type-Options" content="nosniff" />
    <meta name="referrer" content="strict-origin-when-cross-origin" />

    <link rel="preload" as="image" href="/avatar.svg" fetchpriority="high" media="(min-width: 1024px)" />

    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="Rejie Rufin" />
    <meta property="og:title" content="Rejie Rufin — Freight Forwarding &amp; Shipping Operations Specialist" />
    <meta
      property="og:description"
      content="Import customs manifests, ocean and air freight documentation, and the process tools that keep both accurate."
    />
    <!-- <meta property="og:url" content="https://rejierufin.github.io/" /> -->
    <meta name="twitter:card" content="summary_large_image" />

    <script>
      (function () {
        try {
          document.documentElement.dataset.theme =
            localStorage.getItem('theme') === 'dark' ? 'dark' : 'light'
        } catch (e) {
          document.documentElement.dataset.theme = 'light'
        }
        if (document.documentElement.dataset.theme === 'dark') {
          var bar = document.querySelector('meta[name="theme-color"]')
          if (bar) bar.setAttribute('content', '#070b14')
        }
      })()
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
